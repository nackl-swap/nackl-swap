name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  secret-scan:
    # Server-side backstop for tools/hooks/pre-commit (a local hook can be skipped with --no-verify).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan the whole history, not just the last commit
      # The gitleaks CLI directly (pinned image): gitleaks-action@v2 needs a licence key for
      # organisation-owned repos. --redact keeps any match out of the public CI log.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --redact --verbose --exit-code 1

  web-tests:
    # BOC decoder/encoder against real Shellnet events and tvm-cli reference bodies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/test_boc.mjs
