name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  secret-scan:
    # Server-side backstop for tools/hooks/pre-commit (a local hook can be skipped with --no-verify).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-tests:
    # BOC decoder/encoder against real Shellnet events and tvm-cli reference bodies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/test_boc.mjs
